# =====================================================
# CONFIGURATION NETLIFY - Arnold Paysages
# =====================================================
#
# STRATÉGIE DE DÉPLOIEMENT:
# - Branche principale (main) : affiche la page de maintenance
# - Branche de développement (dev/production) : site complet en preview
#
# Pour activer le site final sur le domaine principal :
#   1. Changez publish = "maintenance" en publish = "site"
#   OU
#   2. Utilisez le split testing dans les paramètres Netlify
#
# =====================================================

[build]
  # Mode MAINTENANCE activé - Le public voit la page de maintenance
  publish = "maintenance"
  command = "echo 'Site statique - pas de build necessaire'"

# Variables d'environnement
[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# =====================================================
# CONFIGURATION PAR BRANCHE (Branch Deploys)
# =====================================================

# Branche de développement - déploie le site complet
# Accessible via: dev--arnold-paysages.netlify.app
[context.dev]
  publish = "site"
  command = "echo 'Deploiement branche dev - site complet'"

# Branche de production - déploie le site complet
# Accessible via: production--arnold-paysages.netlify.app
[context.production]
  publish = "site"
  command = "echo 'Deploiement branche production - site complet'"

# Configuration pour les deploy previews (Pull Requests)
[context.deploy-preview]
  publish = "site"
  command = "echo 'Deploy preview - site complet'"

# Configuration pour les branch deploys
[context.branch-deploy]
  publish = "site"
  command = "echo 'Branch deploy - site complet'"

# =====================================================
# REDIRECTIONS
# =====================================================

# Redirection catch-all pour SPA (si nécessaire)
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200

# =====================================================
# HEADERS DE SÉCURITÉ
# =====================================================

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache pour les assets statiques
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
